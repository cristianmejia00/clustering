# Anthropic provider settings
# Model names follow litellm convention: https://docs.litellm.ai/docs/providers/anthropic
# Claude 5.x thinks adaptively and rejects temperature and forced tool use, so
# JSON is requested in the prompt (litellm 1.83 would force a tool call for
# response_format). Effort trades depth for cost: low | medium | high.
model: "anthropic/claude-sonnet-5-5"
api_key_file: "assets/credentials/claude.key"
api_key_env_var: "ANTHROPIC_API_KEY"
temperature: null
max_tokens: 16000
structured_output: false
extra_params:
  output_config:
    effort: "medium"
